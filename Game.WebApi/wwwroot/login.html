<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center px-4">
  <main class="max-w-md w-full p-8 bg-slate-800 rounded-xl shadow-2xl">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Sign in</h1>
      <p class="text-sm text-slate-400 mt-1">Welcome back. Enter your credentials.</p>
    </header>

    <form id="login-form" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          minlength="8"
          class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
        />
      </div>

      <div id="error" class="hidden text-sm text-red-400 bg-red-900/30 border border-red-700/50 rounded-lg px-3 py-2"></div>

      <button
        id="submit"
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 rounded-lg font-medium transition"
      >
        Sign in
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-400 text-center">
      No account?
      <a href="/register.html" class="text-indigo-400 hover:text-indigo-300 underline">Create one</a>
    </p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.add('hidden');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Email and password are required.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          showError(data?.message ?? 'Sign in failed.');
          return;
        }

        localStorage.setItem('auth.token', data.token);
        localStorage.setItem('auth.expiresAt', data.expiresAt);
        localStorage.setItem('auth.user', JSON.stringify({
          userId: data.userId,
          email: data.email,
          displayName: data.displayName,
        }));

        window.location.href = '/profile.html';
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
