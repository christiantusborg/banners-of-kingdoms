<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center px-4">
  <main class="max-w-md w-full p-8 bg-slate-800 rounded-xl shadow-2xl space-y-6">
    <header>
      <h1 class="text-2xl font-bold">Protected profile</h1>
      <p class="text-sm text-slate-400 mt-1">Data fetched from <code class="text-slate-300">GET /api/auth/me</code> with your JWT.</p>
    </header>

    <div id="status" class="text-sm text-slate-400">Loading...</div>

    <dl id="details" class="hidden space-y-3 text-sm">
      <div class="flex justify-between border-b border-slate-700 pb-2">
        <dt class="text-slate-400">Display name</dt>
        <dd id="d-displayName" class="font-medium"></dd>
      </div>
      <div class="flex justify-between border-b border-slate-700 pb-2">
        <dt class="text-slate-400">Email</dt>
        <dd id="d-email" class="font-medium"></dd>
      </div>
      <div class="flex justify-between border-b border-slate-700 pb-2">
        <dt class="text-slate-400">User ID</dt>
        <dd id="d-userId" class="font-mono text-xs"></dd>
      </div>
      <div class="flex justify-between">
        <dt class="text-slate-400">Created</dt>
        <dd id="d-createdAt" class="font-medium"></dd>
      </div>
    </dl>

    <button
      id="signout"
      class="w-full bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-medium"
    >
      Sign out
    </button>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');

    function signOut() {
      localStorage.removeItem('auth.token');
      localStorage.removeItem('auth.expiresAt');
      localStorage.removeItem('auth.user');
      window.location.href = '/login.html';
    }

    document.getElementById('signout').addEventListener('click', signOut);

    async function load() {
      const token = localStorage.getItem('auth.token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const response = await fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (response.status === 401) {
          signOut();
          return;
        }

        if (!response.ok) {
          statusEl.textContent = `Request failed (${response.status}).`;
          return;
        }

        const me = await response.json();
        document.getElementById('d-displayName').textContent = me.displayName;
        document.getElementById('d-email').textContent = me.email;
        document.getElementById('d-userId').textContent = me.userId;
        document.getElementById('d-createdAt').textContent = new Date(me.createdAt).toLocaleString();
        statusEl.classList.add('hidden');
        detailsEl.classList.remove('hidden');
      } catch (err) {
        statusEl.textContent = 'Network error loading profile.';
      }
    }

    load();
  </script>
</body>
</html>
